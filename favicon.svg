<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="apGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="18" fill="#090e1c"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#apGrad)" stroke-width="2.5" opacity="0.8"/>
  <text x="32" y="42" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="900" fill="url(#apGrad)" text-anchor="middle" filter="url(#glow)">AP</text>
</svg>
